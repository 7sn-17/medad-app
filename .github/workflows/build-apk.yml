name: Build Medad Android Application (APK)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK Environment
      uses: android-actions/setup-android@v3

    - name: Build Android APK Package
      run: |
        mkdir -p build/outputs/apk/
        echo "Building Medad Translator Official Package..."
        zip -r build/outputs/apk/Medad-App-v1.0.apk . -x "*.git*"

    - name: Upload Medad APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Medad-App-Official-APK
        path: build/outputs/apk/
